name: 发布网站与 Telegram 通知

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npx quartz build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  notify-telegram:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-telegram-notes]') }}
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: 通知频道
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_ZAWEN_BOT_TOKEN }}
          TELEGRAM_MESSAGES_PATH: static/telegram-notes/messages.json
          PUBLISH_MODE: all
          START_INDEX: "1"
          EXPECTED_BOT_USERNAME: zawen_publish_bot
        run: node scripts/publish-misc-telegraph.mjs
