name: 发布 Telegraph 杂文到 Telegram

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 发布模式
        required: true
        type: choice
        default: discover
        options:
          - discover
          - test
          - all
      start_index:
        description: 从清单第几篇开始
        required: true
        default: "1"
      messages_path:
        description: 仓库内的发布清单路径
        required: true
        default: "static/misc-20260902/messages.json"

permissions:
  contents: read

concurrency:
  group: publish-misc-telegraph
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: 发布到杂文频道
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_ZAWEN_BOT_TOKEN }}
          PUBLISH_MODE: ${{ inputs.mode }}
          START_INDEX: ${{ inputs.start_index }}
          TELEGRAM_MESSAGES_PATH: ${{ inputs.messages_path }}
        run: node scripts/publish-misc-telegraph.mjs
